
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استخراج الباركود</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode-svg@1.1.0/lib/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
        .font-adlam {
            font-family: 'ADLaM Display', system-ui;
        }
        .qr-wrapper svg {
            width: 100%;
            height: auto;
            max-width: 250px;
            margin: 0 auto;
            display: block;
        }

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl shadow-xl border border-gray-100 w-full max-w-md p-8 text-center relative overflow-hidden">
        
        <div class="mb-6">
            <h1 class="text-3xl font-bold text-gray-800 mb-2">طباعة id الطالب</h1>
            <p class="text-gray-500 text-sm">أدخل الكود الجامعي المكون من 6 أرقام</p>
        </div>
        
        <form id="qrForm" class="space-y-4">
            <div>
                <input type="text" id="studentId" inputmode="numeric" pattern="\d{6}" maxlength="6" 
                    class="w-full text-center text-4xl tracking-widest font-bold text-gray-800 border-2 border-gray-200 rounded-2xl px-4 py-3 focus:outline-none focus:border-indigo-500 focus:ring-4 focus:ring-indigo-50 transition" 
                    placeholder="123456" required autocomplete="off">
            </div>
            <p id="errorMsg" class="text-red-500 text-sm font-semibold hidden">يرجى إدخال 6 أرقام إنجليزية فقط</p>
            
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-2xl transition duration-300 shadow-md hover:shadow-lg flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                </svg>
                إنشاء وحفظ الرمز
            </button>
        </form>

        <div id="qrDisplay" class="mt-8 hidden">
            <div class="p-4 bg-gray-50 rounded-2xl border border-gray-200 mb-4">
                <div id="qrWrapper" class="qr-wrapper bg-white p-2 rounded-xl shadow-sm"></div>
            </div>
        </div>

        <div class="mt-6 bg-gray-50 rounded-2xl p-4 border border-gray-100 text-right">
            <p class="text-gray-700 text-sm font-bold mb-3">هل واجهت أي مشكلة؟ (اختياري)</p>
            <textarea id="feedbackText" rows="2" 
                class="w-full border border-gray-200 rounded-xl p-3 focus:outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-50 transition resize-none text-sm text-gray-700" 
                placeholder="اكتب ملاحظاتك قبل أو بعد الطباعة..."></textarea>
            <button id="sendFeedbackBtn" 
                class="mt-3 w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-2.5 px-4 rounded-xl transition duration-200 text-sm">
                إرسال الملاحظات
            </button>
            <div id="thankYouMsg" class="hidden mt-3 bg-green-50 border border-green-200 rounded-xl p-3 text-center">
                <p class="font-adlam text-green-700 text-lg">Thank You!</p>
                <p class="text-green-600 text-xs font-medium mt-1">تم الإرسال بنجاح.</p>
            </div>
        </div>

        <div class="mt-8 flex flex-col items-center gap-1">
            <p class="text-gray-400 tracking-wider">
                <span class="font-adlam text-sm">Designed by EIDRESHA</span>

        </div>
